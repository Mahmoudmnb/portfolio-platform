name: portfolio_admin
description: Bannan Studio owner dashboard for Android.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  portfolio_api:
    path: ../packages/portfolio_api
  dio: ^5.11.1
  flutter_svg: ^2.3.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.1.0
  flutter_markdown_plus: ^1.0.7
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  test: ^1.31.1
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/figma/
    - assets/fonts/Manrope-OFL.txt
    - assets/fonts/Roboto-OFL.txt
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
