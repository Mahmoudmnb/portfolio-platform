name: Backend
on:
  push:
    paths: ['backend/**', 'docs/**', 'scripts/**', 'compose.yaml', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'docs/**', 'scripts/**', 'compose.yaml', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: portfolio_testing
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: ci-disposable-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio_testing"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: portfolio_testing
      DB_USERNAME: portfolio
      DB_PASSWORD: ci-disposable-only
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
    defaults:
      run:
        working-directory: backend
    steps:
      # Stable major action releases; deliberate updates are reviewed with dependency changes.
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, gd, mbstring, bcmath, pcntl, dom, zip
          coverage: none
          tools: composer:2.9.5
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: pip install -r ../scripts/requirements.txt
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=512M
      - run: php artisan migrate --force
      - run: php artisan migrate:rollback --force
      - run: php artisan migrate --force
      - run: php artisan test
      - run: python ../scripts/check-openapi.py
      - run: composer audit --locked
      - run: docker compose -f ../compose.yaml config --quiet
