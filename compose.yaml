x-app: &app
  build: ./backend
  env_file: ./backend/.env
  environment:
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: portfolio
    DB_USERNAME: portfolio
    DB_PASSWORD: ${MYSQL_PASSWORD:-local-development-only}
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
  volumes:
    - media:/app/storage/app
    - logs:/app/storage/logs
  depends_on:
    mysql:
      condition: service_healthy
  restart: unless-stopped
services:
  app:
    <<: *app
    ports: ["${APP_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=2", "--tries=3", "--timeout=90", "--max-time=3600"]
  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
  mysql:
    image: mariadb:12.3.3
    environment:
      MYSQL_DATABASE: portfolio
      MYSQL_USER: portfolio
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-development-only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-development-only}
    ports: ["127.0.0.1:${DB_PORT:-3306}:3306"]
    volumes: ["mysql_database:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports: ["127.0.0.1:${MAILPIT_PORT:-8025}:8025"]
volumes:
  mysql_database:
  media:
  logs:
