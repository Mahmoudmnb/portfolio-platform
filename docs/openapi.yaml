{
  "openapi": "3.1.0",
  "info": {
    "title": "Portfolio Platform REST API",
    "version": "1.0.0",
    "description": "JSON-only owner/public API. All API responses use Cache-Control: no-store and a server-generated UUID X-Request-ID. Public reads expose only visible content; known media URLs remain accessible after unpublishing. Bearer tokens expire in 7 days; no registration or refresh endpoint. Markdown is untrusted text. Errors never expose SQL or traces. Query booleans use 0/1; body booleans use JSON booleans. Lists use stable ID tie-breakers. Public entries: featured desc, sort_order asc, published_at desc, id asc; other ordered content sort_order then id, technologies id. Analytics are accepted events, including bots/retries, never unique visitors. HTTP links cannot contain credentials and are never fetched."
  },
