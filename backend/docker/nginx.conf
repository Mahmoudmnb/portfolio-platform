# TLS edge example; replace server_name and certificate paths for your host.
server {
    listen 443 ssl;
    server_name api.example.test;
    ssl_certificate /etc/tls/fullchain.pem;
    ssl_certificate_key /etc/tls/privkey.pem;
    client_max_body_size 12m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Disable request access logs to avoid IPs and sensitive query strings.
    access_log off;
    location /storage/ {
        alias /srv/portfolio/storage/app/public/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
